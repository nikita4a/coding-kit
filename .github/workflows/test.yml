name: kit gates

on:
  push:
  pull_request:

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap memory (engine self-test)
        run: python scripts/install.py
      - name: Doctor (manifest, versions, frontmatter, db integrity)
        run: python scripts/doctor.py
      - name: File-size gate
        run: python scripts/tools/check_file_sizes.py --ci
      - name: Trap-suite (dry-run validation)
        run: python eval/runner.py
      - name: Trigger queries validation
        run: python eval/trigger_eval.py --queries eval/trigger_queries.json
      - name: Unit tests (install + root resolver)
        run: python -m unittest discover -s tests
